<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="AI Emergency Command Center live incident dashboard."
    >

    <title>Dashboard | AI Emergency Command Center</title>

    <style>
        /* =====================================================
           RESET & VARIABLES
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;

            --danger: #dc2626;
            --danger-light: #fef2f2;

            --warning: #d97706;
            --warning-light: #fffbeb;

            --success: #16a34a;
            --success-light: #f0fdf4;

            --info: #0891b2;
            --info-light: #ecfeff;

            --dark: #0f172a;
            --text: #1e293b;
            --muted: #64748b;

            --background: #f1f5f9;
            --white: #ffffff;
            --border: #e2e8f0;

            --sidebar-width: 250px;

            --shadow:
                0 8px 25px rgba(15, 23, 42, 0.06);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;

            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: var(--background);

            color: var(--text);
        }

        button,
        input,
        select {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* =====================================================
           APP LAYOUT
        ===================================================== */

        .app {
            min-height: 100vh;
            display: flex;
        }

        /* =====================================================
           SIDEBAR
        ===================================================== */

        .sidebar {
            width: var(--sidebar-width);
            height: 100vh;

            position: fixed;
            left: 0;
            top: 0;

            display: flex;
            flex-direction: column;

            background: #0f172a;

            color: white;

            z-index: 100;

            transition: transform .25s ease;
        }

        .sidebar-header {
            height: 72px;

            padding: 0 20px;

            display: flex;
            align-items: center;

            border-bottom:
                1px solid rgba(255,255,255,.07);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-icon {
            width: 37px;
            height: 37px;

            display: grid;
            place-items: center;

            border-radius: 9px;

            background: var(--danger);

            font-weight: 900;
            font-size: 18px;
        }

        .brand-name strong {
            display: block;

            font-size: 12px;
            line-height: 1.2;
        }

        .brand-name span {
            display: block;

            margin-top: 3px;

            color: #64748b;

            font-size: 8px;
        }

        /* =====================================================
           NAVIGATION
        ===================================================== */

        .sidebar-nav {
            flex: 1;

            padding: 18px 12px;

            overflow-y: auto;
        }

        .nav-section-title {
            padding: 0 10px;

            margin:
                17px 0
                8px;

            color: #64748b;

            font-size: 8px;
            font-weight: 800;

            text-transform: uppercase;

            letter-spacing: .08em;
        }

        .nav-item {
            width: 100%;

            display: flex;
            align-items: center;
            gap: 11px;

            padding: 10px 11px;

            margin-bottom: 3px;

            border-radius: 8px;

            color: #94a3b8;

            font-size: 10px;
            font-weight: 600;

            border: none;

            background: transparent;

            text-align: left;

            transition: .2s;
        }

        .nav-item:hover {
            background: rgba(255,255,255,.05);
            color: white;
        }

        .nav-item.active {
            background: rgba(37,99,235,.18);
            color: #93c5fd;
        }

        .nav-icon {
            width: 20px;

            text-align: center;

            font-size: 13px;
        }

        .nav-badge {
            margin-left: auto;

            min-width: 20px;
            height: 18px;

            padding: 0 5px;

            display: grid;
            place-items: center;

            border-radius: 20px;

            background: var(--danger);

            color: white;

            font-size: 8px;
            font-weight: 800;
        }

        /* =====================================================
           SIDEBAR FOOTER
        ===================================================== */

        .sidebar-footer {
            padding: 13px;

            border-top:
                1px solid rgba(255,255,255,.07);
        }

        .operator {
            display: flex;
            align-items: center;

            gap: 9px;

            padding: 8px;

            border-radius: 9px;

            background: rgba(255,255,255,.04);
        }

        .avatar {
            width: 31px;
            height: 31px;

            display: grid;
            place-items: center;

            border-radius: 50%;

            background: #2563eb;

            font-size: 9px;
            font-weight: 800;
        }

        .operator-info {
            min-width: 0;
            flex: 1;
        }

        .operator-info strong {
            display: block;

            font-size: 9px;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .operator-info span {
            display: block;

            margin-top: 2px;

            color: #64748b;

            font-size: 7px;
        }

        .logout-button {
            border: none;

            background: transparent;

            color: #64748b;

            font-size: 13px;
        }

        .logout-button:hover {
            color: #f87171;
        }

        /* =====================================================
           MAIN CONTENT
        ===================================================== */

        .main {
            flex: 1;

            margin-left: var(--sidebar-width);

            min-width: 0;
        }

        /* =====================================================
           TOP HEADER
        ===================================================== */

        .topbar {
            height: 72px;

            background: white;

            border-bottom: 1px solid var(--border);

            padding:
                0 27px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            position: sticky;
            top: 0;

            z-index: 50;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 13px;
        }

        .mobile-menu {
            display: none;

            border: none;
            background: transparent;

            font-size: 19px;
        }

        .page-title h1 {
            font-size: 17px;

            letter-spacing: -.3px;

            color: var(--dark);
        }

        .page-title p {
            margin-top: 3px;

            color: var(--muted);

            font-size: 9px;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .system-live {
            display: flex;
            align-items: center;
            gap: 7px;

            padding: 7px 10px;

            border: 1px solid #bbf7d0;

            background: var(--success-light);

            border-radius: 7px;

            color: #15803d;

            font-size: 8px;
            font-weight: 800;
        }

        .live-dot {
            width: 6px;
            height: 6px;

            border-radius: 50%;

            background: #22c55e;

            box-shadow:
                0 0 0 4px rgba(34,197,94,.12);
        }

        .notification-button {
            width: 34px;
            height: 34px;

            position: relative;

            display: grid;
            place-items: center;

            border: 1px solid var(--border);

            background: white;

            border-radius: 8px;

            color: #64748b;
        }

        .notification-count {
            position: absolute;

            top: -4px;
            right: -4px;

            width: 15px;
            height: 15px;

            display: grid;
            place-items: center;

            border-radius: 50%;

            background: var(--danger);

            color: white;

            font-size: 7px;
            font-weight: 800;
        }

        /* =====================================================
           PAGE CONTENT
        ===================================================== */

        .content {
            padding: 25px 27px 40px;
        }

        /* =====================================================
           EMERGENCY ALERT
        ===================================================== */

        .emergency-alert {
            display: flex;
            align-items: center;

            gap: 13px;

            padding: 12px 15px;

            margin-bottom: 20px;

            background: #fff7ed;

            border:
                1px solid #fed7aa;

            border-radius: 10px;
        }

        .alert-icon {
            width: 33px;
            height: 33px;

            flex-shrink: 0;

            display: grid;
            place-items: center;

            border-radius: 8px;

            background: #ffedd5;

            color: #ea580c;

            font-size: 14px;
        }

        .alert-content {
            flex: 1;
        }

        .alert-content strong {
            display: block;

            font-size: 10px;

            color: #9a3412;
        }

        .alert-content span {
            display: block;

            margin-top: 3px;

            color: #c2410c;

            font-size: 8px;
        }

        .alert-action {
            border: 1px solid #fdba74;

            background: white;

            color: #c2410c;

            border-radius: 6px;

            padding: 7px 10px;

            font-size: 8px;
            font-weight: 800;
        }

        /* =====================================================
           STAT CARDS
        ===================================================== */

        .stats-grid {
            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 13px;

            margin-bottom: 20px;
        }

        .stat-card {
            background: white;

            border: 1px solid var(--border);

            border-radius: 11px;

            padding: 17px;

            box-shadow: var(--shadow);

            position: relative;

            overflow: hidden;
        }

        .stat-card::after {
            content: "";

            position: absolute;

            width: 75px;
            height: 75px;

            border-radius: 50%;

            right: -35px;
            top: -35px;

            opacity: .5;
        }

        .stat-card.red::after {
            background: #fee2e2;
        }

        .stat-card.orange::after {
            background: #ffedd5;
        }

        .stat-card.green::after {
            background: #dcfce7;
        }

        .stat-card.blue::after {
            background: #dbeafe;
        }

        .stat-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .stat-label {
            color: var(--muted);

            font-size: 8px;

            text-transform: uppercase;

            font-weight: 800;

            letter-spacing: .05em;
        }

        .stat-icon {
            width: 29px;
            height: 29px;

            display: grid;
            place-items: center;

            border-radius: 7px;

            font-size: 12px;
        }

        .red .stat-icon {
            background: #fee2e2;
            color: var(--danger);
        }

        .orange .stat-icon {
            background: #ffedd5;
            color: #ea580c;
        }

        .green .stat-icon {
            background: #dcfce7;
            color: var(--success);
        }

        .blue .stat-icon {
            background: #dbeafe;
            color: var(--primary);
        }

        .stat-number {
            margin-top: 13px;

            font-size: 25px;

            line-height: 1;

            font-weight: 800;

            color: var(--dark);
        }

        .stat-change {
            margin-top: 8px;

            font-size: 8px;
        }

        .stat-change.up {
            color: var(--danger);
        }

        .stat-change.down {
            color: var(--success);
        }

        .stat-change.neutral {
            color: var(--muted);
        }

        /* =====================================================
           MAIN GRID
        ===================================================== */

        .dashboard-grid {
            display: grid;

            grid-template-columns:
                minmax(0, 1.55fr)
                minmax(300px, .75fr);

            gap: 18px;
        }

        /* =====================================================
           PANEL
        ===================================================== */

        .panel {
            background: white;

            border: 1px solid var(--border);

            border-radius: 11px;

            box-shadow: var(--shadow);

            overflow: hidden;
        }

        .panel-header {
            min-height: 57px;

            padding: 0 16px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            border-bottom:
                1px solid var(--border);
        }

        .panel-title h2 {
            font-size: 11px;

            color: var(--dark);
        }

        .panel-title p {
            margin-top: 3px;

            color: var(--muted);

            font-size: 8px;
        }

        .panel-action {
            border: 1px solid var(--border);

            background: white;

            padding: 6px 9px;

            border-radius: 6px;

            color: var(--muted);

            font-size: 8px;
            font-weight: 700;
        }

        .panel-action:hover {
            border-color: #bfdbfe;
            color: var(--primary);
        }

        /* =====================================================
           INCIDENT TABLE
        ===================================================== */

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;

            border-collapse: collapse;

            min-width: 650px;
        }

        th {
            padding:
                10px 13px;

            text-align: left;

            background: #f8fafc;

            color: #64748b;

            font-size: 7px;

            text-transform: uppercase;

            letter-spacing: .05em;
        }

        td {
            padding:
                12px 13px;

            border-top:
                1px solid #f1f5f9;

            color: #475569;

            font-size: 8px;
        }

        tbody tr {
            cursor: pointer;

            transition: background .15s;
        }

        tbody tr:hover {
            background: #f8fafc;
        }

        .incident-id {
            color: var(--primary);

            font-weight: 800;
        }

        .incident-name {
            color: var(--dark);

            font-weight: 700;
        }

        .incident-location {
            color: #64748b;
        }

        /* =====================================================
           PRIORITY BADGES
        ===================================================== */

        .priority {
            display: inline-flex;

            align-items: center;

            gap: 4px;

            padding: 4px 7px;

            border-radius: 20px;

            font-size: 7px;

            font-weight: 800;
        }

        .priority.critical {
            background: #fee2e2;
            color: #b91c1c;
        }

        .priority.high {
            background: #ffedd5;
            color: #c2410c;
        }

        .priority.medium {
            background: #fef3c7;
            color: #a16207;
        }

        .priority.low {
            background: #dcfce7;
            color: #15803d;
        }

        /* =====================================================
           STATUS BADGES
        ===================================================== */

        .incident-status {
            display: inline-flex;

            align-items: center;

            gap: 5px;

            font-size: 7px;

            font-weight: 700;
        }

        .status-indicator {
            width: 6px;
            height: 6px;

            border-radius: 50%;
        }

        .status-active {
            color: #dc2626;
        }

        .status-active .status-indicator {
            background: #ef4444;
        }

        .status-response {
            color: #d97706;
        }

        .status-response .status-indicator {
            background: #f59e0b;
        }

        .status-resolved {
            color: #16a34a;
        }

        .status-resolved .status-indicator {
            background: #22c55e;
        }

        /* =====================================================
           RIGHT SIDE
        ===================================================== */

        .right-column {
            display: flex;

            flex-direction: column;

            gap: 18px;
        }

        /* =====================================================
           PRIORITY DISTRIBUTION
        ===================================================== */

        .priority-list {
            padding: 15px 16px 17px;
        }

        .priority-row {
            margin-bottom: 14px;
        }

        .priority-row:last-child {
            margin-bottom: 0;
        }

        .priority-label {
            display: flex;

            justify-content: space-between;

            margin-bottom: 6px;

            font-size: 8px;
        }

        .priority-label span:first-child {
            color: #475569;
        }

        .priority-label span:last-child {
            color: var(--dark);

            font-weight: 800;
        }

        .progress {
            height: 6px;

            overflow: hidden;

            background: #f1f5f9;

            border-radius: 20px;
        }

        .progress-bar {
            height: 100%;

            border-radius: inherit;
        }

        .progress-critical {
            width: 22%;
            background: #ef4444;
        }

        .progress-high {
            width: 36%;
            background: #f97316;
        }

        .progress-medium {
            width: 49%;
            background: #eab308;
        }

        .progress-low {
            width: 64%;
            background: #22c55e;
        }

        /* =====================================================
           AI SUMMARY
        ===================================================== */

        .ai-summary {
            padding: 15px 16px;
        }

        .ai-header {
            display: flex;
            align-items: center;
            gap: 8px;

            margin-bottom: 11px;
        }

        .ai-icon {
            width: 28px;
            height: 28px;

            display: grid;
            place-items: center;

            border-radius: 7px;

            background: #eff6ff;

            color: var(--primary);

            font-size: 12px;
        }

        .ai-header strong {
            display: block;

            font-size: 9px;
        }

        .ai-header span {
            display: block;

            margin-top: 2px;

            color: var(--muted);

            font-size: 7px;
        }

        .ai-text {
            padding: 11px;

            border-radius: 8px;

            background: #f8fafc;

            color: #475569;

            font-size: 8px;

            line-height: 1.65;
        }

        .ai-tags {
            display: flex;
            flex-wrap: wrap;

            gap: 5px;

            margin-top: 9px;
        }

        .ai-tag {
            padding: 4px 6px;

            border-radius: 5px;

            background: #eff6ff;

            color: #2563eb;

            font-size: 7px;

            font-weight: 700;
        }

        /* =====================================================
           RESPONSE TEAM
        ===================================================== */

        .team-list {
            padding: 5px 16px 12px;
        }

        .team-item {
            display: flex;
            align-items: center;

            gap: 9px;

            padding: 9px 0;

            border-bottom:
                1px solid #f1f5f9;
        }

        .team-item:last-child {
            border-bottom: none;
        }

        .team-avatar {
            width: 28px;
            height: 28px;

            display: grid;
            place-items: center;

            border-radius: 7px;

            background: #eff6ff;

            color: #2563eb;

            font-size: 8px;

            font-weight: 800;
        }

        .team-info {
            flex: 1;
        }

        .team-info strong {
            display: block;

            color: var(--dark);

            font-size: 8px;
        }

        .team-info span {
            display: block;

            margin-top: 2px;

            color: var(--muted);

            font-size: 7px;
        }

        .team-status {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #22c55e;
        }

        /* =====================================================
           MAP PLACEHOLDER
        ===================================================== */

        .map-container {
            height: 180px;

            position: relative;

            overflow: hidden;

            background:
                linear-gradient(
                    90deg,
                    rgba(226,232,240,.8) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    rgba(226,232,240,.8) 1px,
                    transparent 1px
                );

            background-size: 35px 35px;

            background-color: #f8fafc;
        }

        .map-road {
            position: absolute;

            height: 7px;

            background: #e2e8f0;

            transform: rotate(-18deg);

            width: 130%;

            left: -15%;
        }

        .road-one {
            top: 55px;
        }

        .road-two {
            top: 125px;

            transform: rotate(25deg);
        }

        .map-road.vertical {
            height: 130%;

            width: 7px;

            top: -15%;

            left: 45%;

            transform: rotate(7deg);
        }

        .map-pin {
            position: absolute;

            width: 19px;
            height: 19px;

            display: grid;
            place-items: center;

            border-radius: 50% 50% 50% 0;

            transform:
                rotate(-45deg);

            background: var(--danger);

            box-shadow:
                0 4px 10px
                rgba(220,38,38,.25);
        }

        .map-pin span {
            transform: rotate(45deg);

            color: white;

            font-size: 8px;
        }

        .pin-one {
            left: 24%;
            top: 30%;
        }

        .pin-two {
            left: 59%;
            top: 55%;

            background: #f97316;
        }

        .pin-three {
            left: 72%;
            top: 25%;

            background: #2563eb;
        }

        .map-overlay {
            position: absolute;

            left: 12px;
            bottom: 10px;

            padding: 7px 9px;

            border-radius: 7px;

            background: rgba(255,255,255,.92);

            box-shadow:
                0 4px 12px
                rgba(15,23,42,.08);

            font-size: 7px;
        }

        .map-overlay strong {
            display: block;
        }

        .map-overlay span {
            color: var(--muted);
        }

        /* =====================================================
           MOBILE OVERLAY
        ===================================================== */

        .sidebar-overlay {
            display: none;

            position: fixed;

            inset: 0;

            background:
                rgba(15,23,42,.45);

            z-index: 90;
        }

        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 1150px) {

            .stats-grid {
                grid-template-columns:
                    repeat(2, 1fr);
            }

            .dashboard-grid {
                grid-template-columns: 1fr;
            }

            .right-column {
                display: grid;

                grid-template-columns:
                    repeat(2, 1fr);
            }
        }

        @media (max-width: 850px) {

            .sidebar {
                transform:
                    translateX(-100%);
            }

            .sidebar.open {
                transform:
                    translateX(0);
            }

            .sidebar-overlay.show {
                display: block;
            }

            .main {
                margin-left: 0;
            }

            .mobile-menu {
                display: block;
            }

            .right-column {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 600px) {

            .topbar {
                padding:
                    0 15px;
            }

            .content {
                padding:
                    17px 15px 30px;
            }

            .system-live {
                display: none;
            }

            .stats-grid {
                grid-template-columns: 1fr 1fr;

                gap: 9px;
            }

            .stat-card {
                padding: 13px;
            }

            .stat-number {
                font-size: 21px;
            }

            .emergency-alert {
                align-items: flex-start;
            }

            .alert-action {
                display: none;
            }
        }

        @media (max-width: 420px) {

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .page-title p {
                display: none;
            }

            .notification-button {
                width: 31px;
                height: 31px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- =====================================================
         SIDEBAR
    ===================================================== -->

    <aside class="sidebar" id="sidebar">

        <div class="sidebar-header">

            <a href="dashboard.html" class="brand">

                <div class="brand-icon">
                    +
                </div>

                <div class="brand-name">

                    <strong>
                        AI Emergency Command
                    </strong>

                    <span>
                        COMMAND CENTER
                    </span>

                </div>

            </a>

        </div>
